name: worker-smoke
# P3 验收用：验证 workflow_dispatch 路径 + artifact 上传。
# 仅用于 oss-scout v2 worker 测试，不扫描任何第三方项目。
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "job id for artifact naming"
        default: "smoke"
      oss_job_b64:
        description: "base64 job payload (unused by smoke, echo-only)"
        default: ""
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: fake worker run
        run: |
          mkdir -p artifacts/${{ github.event.inputs.job_id }}
          cat > artifacts/${{ github.event.inputs.job_id }}/result.json <<EOF
          {"schema_version": 1, "job_id": "${{ github.event.inputs.job_id }}",
           "backend": "github_actions", "outcome": "succeeded"}
          EOF
          # stdout 信封：与 Modal worker 同一协议，存储配额受限时的回传通道
          python3 - <<'PY'
          import json
          env = {"result": json.load(open("artifacts/${{ github.event.inputs.job_id }}/result.json"))}
          print("##OSSCOUT_RESULT##" + json.dumps(env))
          PY
      - uses: actions/upload-artifact@v4
        continue-on-error: true     # 存储配额满时不阻塞 run，结果走 stdout 信封
        with:
          name: result-${{ github.event.inputs.job_id }}
          path: artifacts/
